services:
  - type: web
    name: fastapi-asteroids
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NASA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: REDIS_URL
        sync: false
      - key: CACHE_ADMIN_TOKEN
        sync: false
